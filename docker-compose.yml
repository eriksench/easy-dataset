services:
  easy-dataset:
    image: ghcr.io/conardli/easy-dataset
    container_name: easy-dataset
    ports:
      - '1717:1717'
    volumes:
      - ./local-db:/app/local-db
      - ./prisma:/app/prisma
    environment:
      KNOW_HUB_BASE_URL: ${KNOW_HUB_BASE_URL:-http://host.docker.internal:8080/jeecg-boot}
      KNOW_HUB_PUBLIC_URL: ${KNOW_HUB_PUBLIC_URL:-http://localhost:3100}
      KNOW_HUB_SSO_ENABLED: ${KNOW_HUB_SSO_ENABLED:-true}
      KNOW_HUB_INTEGRATION_TOKEN: ${KNOW_HUB_INTEGRATION_TOKEN:-}
      EASY_DATASET_SESSION_SECRET: ${EASY_DATASET_SESSION_SECRET:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
